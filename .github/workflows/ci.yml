name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/sync_protocol.py --check
      - run: python -m compileall -q custom_components/ampio packages/ampio-python/src
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build packages/ampio-python
