name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build packages/ampio-python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/ampio-python/dist
          skip-existing: true
